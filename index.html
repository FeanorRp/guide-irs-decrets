<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide IRS - San Andreas</title>
  <meta name="description" content="Guide de l'Internal Revenue Service de San Andreas : choisissez votre zone.">
  <link rel="icon" href="sud/assets/seal.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
  <link rel="stylesheet" href="sud/assets/style.css">
  <style>
    .landing { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 30px 16px; text-align: center; }
    .landing img { width: 170px; height: 170px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .6)); }
    .landing h1 { margin: 0; font-family: var(--serif); letter-spacing: 2px; text-transform: uppercase; font-size: 30px;
      background: linear-gradient(180deg, #f6e3b4, #c9a464); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .landing p { margin: 0; color: var(--muted); }
    .zones { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
    .zone { width: 260px; padding: 26px 20px; text-decoration: none; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-top: 3px solid var(--accent-strong); border-radius: 12px; transition: transform .15s, border-color .15s; }
    .zone:hover { transform: translateY(-3px); border-color: var(--accent); }
    .zone b { display: block; font-family: var(--serif); letter-spacing: 4px; font-size: 26px; color: var(--accent); margin-bottom: 6px; }
    .zone span { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="landing">
    <img src="sud/assets/seal.svg" alt="Sceau de l'IRS">
    <div>
      <div class="hero-kicker">État de San Andreas</div>
      <h1>Guide de l'Internal Revenue Service</h1>
    </div>
    <p>Les règles diffèrent selon la zone. Choisissez la vôtre :</p>
    <div class="zones">
      <a class="zone" href="sud/index.html"><b>SUD</b><span>Guide et décrets de la zone Sud</span></a>
      <a class="zone" href="nord/index.html"><b>NORD</b><span>Guide et décrets de la zone Nord</span></a>
    </div>
  </main>
</body>
</html>
